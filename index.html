
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi - AI Character Chat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101015;color:#f4f4f7;
 font-family:Arial,"Noto Sans JP",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:none;color:inherit}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{
 width:250px;background:#17171f;border-right:1px solid #292934;
 padding:20px;display:flex;flex-direction:column;gap:18px;
}
.logo{font-size:25px;font-weight:bold;color:#c4a5ff}
.nav button{
 width:100%;text-align:left;padding:12px;border-radius:12px;
 background:transparent;margin-bottom:5px;color:#aaa;
}
.nav button:hover,.nav button.active{background:#292535;color:white}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
 height:65px;padding:0 22px;border-bottom:1px solid #292934;
 display:flex;align-items:center;justify-content:space-between;
}
.search{
 background:#20202a;border:1px solid #333340;border-radius:12px;
 padding:10px;color:white;width:min(350px,50vw);outline:none;
}
.content{padding:22px;overflow-y:auto;flex:1}
.section-title{font-size:23px;font-weight:bold;margin:5px 0 18px}
.sub{color:#999;margin-top:-10px;margin-bottom:20px}
.cards{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:16px
}
.card{
 background:#1c1c25;border:1px solid #2b2b36;border-radius:17px;
 overflow:hidden;cursor:pointer;transition:.2s;
}
.card:hover{transform:translateY(-3px);border-color:#8e72ce}
.cover{
 height:190px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#4d426a,#25263d);
 font-size:70px;position:relative;overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover}
.card-info{padding:12px}
.card-name{font-weight:bold;font-size:16px}
.card-desc{color:#aaa;font-size:12px;margin-top:6px}
.tag{display:inline-block;background:#30293f;color:#cbb5ff;
 padding:4px 8px;border-radius:8px;font-size:11px;margin-top:8px}
.primary{
 background:#9474d8;color:white;padding:11px 16px;border-radius:11px;
}
.secondary{background:#292934;padding:10px 14px;border-radius:10px}
.danger{background:#4b252c;padding:9px 12px;border-radius:9px}
.chat-layout{display:flex;height:100%;min-height:0}
.chat{
 flex:1;display:flex;flex-direction:column;min-width:0;
}
.chat-header{
 padding:13px 20px;border-bottom:1px solid #292934;
 display:flex;align-items:center;gap:12px
}
.avatar{
 width:45px;height:45px;border-radius:50%;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 background:#4b4167;font-size:24px;flex-shrink:0
}
.avatar img{width:100%;height:100%;object-fit:cover}
.messages{
 flex:1;overflow-y:auto;padding:20px;
 display:flex;flex-direction:column;gap:15px
}
.msg{display:flex;gap:9px;max-width:85%;align-items:flex-end}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{
 padding:12px 15px;border-radius:16px;line-height:1.65;
 background:#252530;white-space:pre-wrap;word-break:break-word
}
.me .bubble{background:#7154a8}
.msg-photo{
 max-width:260px;border-radius:13px;margin-top:8px;
 overflow:hidden;border:1px solid #464052
}
.photo-scene{
 height:220px;display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:10px;
 background:linear-gradient(145deg,#72628d,#34364d);
 font-size:65px
}
.photo-scene small{font-size:13px;color:#eee}
.chat-input{
 padding:14px;border-top:1px solid #292934;
 display:flex;gap:9px;align-items:center
}
.chat-input input{
 flex:1;min-width:0;background:#20202a;border:1px solid #333340;
 border-radius:13px;padding:13px;color:white;outline:none
}
.profile{
 width:280px;border-left:1px solid #292934;
 padding:20px;overflow:auto;background:#17171f
}
.profile .cover{height:210px;border-radius:15px}
.profile h2{margin-bottom:5px}
.profile p{color:#aaa;line-height:1.7}
.hidden{display:none!important}
.empty{text-align:center;color:#888;padding:40px}
.mobile-menu{display:none}
.modal-bg{
 position:fixed;inset:0;background:#000a;display:flex;
 justify-content:center;align-items:center;padding:15px;z-index:10
}
.modal{
 width:min(500px,100%);max-height:90vh;overflow:auto;
 background:#1c1c25;border:1px solid #383844;border-radius:18px;padding:22px
}
.modal input,.modal textarea{
 width:100%;margin:8px 0 14px;background:#282832;
 border:1px solid #393945;color:white;border-radius:10px;
 padding:12px;outline:none
}
.modal textarea{min-height:90px;resize:vertical}
.modal label{font-size:13px;color:#bbb}
.modal-actions{display:flex;justify-content:flex-end;gap:9px}
.toast{
 position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
 background:#333;padding:12px 18px;border-radius:12px;z-index:20
}
@media(max-width:800px){
 .sidebar{width:70px;padding:12px 8px}
 .logo{text-align:center;font-size:18px}
 .nav button{text-align:center;padding:12px 4px;font-size:12px}
 .nav button span{display:none}
 .profile{display:none}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cover{height:160px}
 .topbar{padding:0 12px}
 .content{padding:14px}
 .chat-header{padding:10px}
 .messages{padding:12px}
}
@media(max-width:450px){
 .cards{gap:10px}
 .cover{height:140px}
 .card-info{padding:9px}
 .msg{max-width:93%}
 .chat-input{padding:9px}
 .chat-input input{padding:11px}
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
 <div class="logo">✦ Lumi</div>
 <div class="nav">
  <button class="active" onclick="showPage('home')">🏠 <span>ホーム</span></button>
  <button onclick="showPage('search')">🔎 <span>探す</span></button>
  <button onclick="showPage('favorites')">♡ <span>お気に入り</span></button>
  <button onclick="showPage('mychars')">🎭 <span>自分のキャラ</span></button>
  <button onclick="createCharacter()">＋ <span>キャラ作成</span></button>
 </div>
 <div style="margin-top:auto;color:#777;font-size:12px">
  Lumi<br>AI Character Chat
 </div>
</aside>

<main class="main">
 <header class="topbar">
  <strong id="pageTitle">ホーム</strong>
  <input class="search" id="searchInput" placeholder="キャラクターを検索..." oninput="render()">
 </header>

 <div class="content" id="content"></div>
</main>

</div>

<div class="modal-bg hidden" id="modalBg">
 <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const defaultCharacters=[
 {
  id:"1",name:"ユイ",emoji:"🌸",
  description:"明るくて優しい、話を聞くのが好きな女の子。",
  personality:"明るい、優しい、元気",
  greeting:"こんにちは！今日は何してたの？✨",
  color:"#8467b5",favorite:false
 },
 {
  id:"2",name:"レン",emoji:"🌙",
  description:"落ち着いた雰囲気で、ゲームが好き。",
  personality:"落ち着いている、ゲーム好き",
  greeting:"おっ、来たね。今日は何の話をする？",
  color:"#526eaa",favorite:false
 },
 {
  id:"3",name:"ソラ",emoji:"☁️",
  description:"好奇心旺盛で、いろんなことに興味がある。",
  personality:"好奇心旺盛、自由",
  greeting:"ねえねえ！面白いこと教えて！",
  color:"#5797a4",favorite:false
 }
];

let characters=JSON.parse(localStorage.getItem("lumi_chars")||"null")||defaultCharacters;
let chats=JSON.parse(localStorage.getItem("lumi_chats")||"{}");
let page="home";
let current=null;

function save(){
 localStorage.setItem("lumi_chars",JSON.stringify(characters));
 localStorage.setItem("lumi_chats",JSON.stringify(chats));
}
function getChar(id){return characters.find(c=>c.id===id)}
function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;t.classList.remove("hidden");
 setTimeout(()=>t.classList.add("hidden"),2200);
}
function showPage(p){
 page=p;current=null;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById("pageTitle").textContent=
  {home:"ホーム",search:"キャラクターを探す",favorites:"お気に入り",mychars:"自分のキャラ"}[p]||"Lumi";
 render();
}
function render(){
 if(current){renderChat();return}
 const content=document.getElementById("content");
 let list=[...characters];
 const q=document.getElementById("searchInput").value.toLowerCase();
 if(q)list=list.filter(c=>(c.name+c.description+c.personality).toLowerCase().includes(q));
 if(page==="favorites")list=list.filter(c=>c.favorite);
 if(page==="mychars")list=list.filter(c=>c.mine);
 content.innerHTML=`
 <div class="section-title">${page==="home"?"おすすめキャラクター":page==="favorites"?"お気に入り":page==="mychars"?"自分のキャラクター":"キャラクター検索"}</div>
 ${page==="home"?'<div class="sub">お気に入りのキャラクターと会話しよう ✨</div>':''}
 <div class="cards">${list.map(cardHTML).join("")}</div>
 ${list.length===0?'<div class="empty">キャラクターが見つかりません</div>':''}
 ${page==="home"?'<br><button class="primary" onclick="createCharacter()">＋ キャラクターを作成</button>':''}
 `;
}
function cardHTML(c){
 return `<div class="card" onclick="openChat('${c.id}')">
 <div class="cover" style="background:linear-gradient(145deg,${c.color||'#65547f'},#25263d)">
 ${c.image?`<img src="${c.image}">`:c.emoji||"✨"}
 </div>
 <div class="card-info">
 <div class="card-name">${esc(c.name)} ${c.favorite?"♥":""}</div>
 <div class="card-desc">${esc(c.description)}</div>
 <span class="tag">AIキャラクター</span>
 </div></div>`;
}
function openChat(id){
 current=id;
 if(!chats[id])chats[id]=[{from:"bot",text:getChar(id).greeting||"こんにちは！"}];
 save();renderChat();
}
function renderChat(){
 const c=getChar(current);
 if(!c){current=null;render();return}
 document.getElementById("pageTitle").textContent=c.name;
 document.getElementById("content").innerHTML=`
 <div class="chat-layout">
 <div class="chat">
  <div class="chat-header">
   <button class="secondary" onclick="current=null;render()">←</button>
   <div class="avatar">${c.image?`<img src="${c.image}">`:c.emoji}</div>
   <div><b>${esc(c.name)}</b><div style="font-size:12px;color:#aaa">AIキャラクター</div></div>
   <button class="secondary" style="margin-left:auto" onclick="toggleFav('${c.id}')">${c.favorite?"♥":"♡"}</button>
  </div>
  <div class="messages" id="messages">${(chats[current]||[]).map(messageHTML).join("")}</div>
  <div class="chat-input">
   <button class="secondary" title="状況写真" onclick="sendPhoto()">📷</button>
   <input id="messageInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMessage()">
   <button class="primary" onclick="sendMessage()">送信</button>
  </div>
 </div>
 <aside class="profile">
  <div class="cover" style="background:linear-gradient(145deg,${c.color||'#65547f'},#25263d)">
   ${c.image?`<img src="${c.image}">`:c.emoji}
  </div>
  <h2>${esc(c.name)}</h2>
  <p>${esc(c.description)}</p>
  <p><b>性格</b><br>${esc(c.personality||"未設定")}</p>
  ${c.mine?`<button class="secondary" onclick="editCharacter('${c.id}')">キャラ編集</button>
  <button class="danger" onclick="deleteCharacter('${c.id}')">削除</button>`:""}
 </aside>
 </div>`;
 const box=document.getElementById("messages");
 box.scrollTop=box.scrollHeight;
}
function messageHTML(m){
 return `<div class="msg ${m.from==="me"?"me":""}">
 <div class="bubble">${esc(m.text||"")}
 ${m.photo?`<div class="msg-photo"><div class="photo-scene">${m.photo.emoji}<small>${esc(m.photo.caption)}</small></div></div>`:""}
 </div></div>`;
}
function sendMessage(){
 const input=document.getElementById("messageInput");
 if(!input)return;
 const text=input.value.trim();if(!text)return;
 chats[current].push({from:"me",text});
 input.value="";save();renderChat();
 setTimeout(()=>{
  chats[current].push({from:"bot",text:fakeReply(text,getChar(current))});
  save();renderChat();
 },600);
}
function fakeReply(text,c){
 if(text.includes("こんにちは")||text.includes("こんちは"))return "こんにちは！"+c.name+"だよ！話しかけてくれてうれしい！";
 if(text.includes("写真")||text.includes("見せて"))return "写真機能から、今の場面を選んでみてね！📷";
 if(text.includes("好き"))return "そうなんだ！"+text+"っていいね！もっと聞かせて！";
 const replies=[
 "そうなんだ！それでどうなったの？",
 "なるほどね！もっと詳しく教えて！",
 "面白そう！私もその話気になる！",
 "へえー！今日はほかに何かあった？",
 "いいね！その気持ちわかるよ！",
 "そういうこともあるよね。続き聞かせて！"
 ];
 return replies[Math.floor(Math.random()*replies.length)];
}
function sendPhoto(){
 const c=getChar(current);
 const scenes=[
  {emoji:"☕",caption:"カフェでのんびりしているところ"},
  {emoji:"🌳",caption:"公園を散歩しているところ"},
  {emoji:"📚",caption:"本を読んでいるところ"},
  {emoji:"🌙",caption:"夜のお部屋でくつろいでいるところ"},
  {emoji:"🎮",caption:"ゲームを遊んでいるところ"},
  {emoji:"🌸",caption:"お花を見に来たところ"}
 ];
 const s=scenes[Math.floor(Math.random()*scenes.length)];
 chats[current].push({from:"bot",text:"今の様子だよ！📷",photo:s});
 save();renderChat();
}
function toggleFav(id){
 const c=getChar(id);c.favorite=!c.favorite;save();renderChat();
}
function createCharacter(){
 document.getElementById("modalBg").classList.remove("hidden");
 document.getElementById("modal").innerHTML=`
 <h2>✨ キャラクター作成</h2>
 <label>キャラクター名</label><input id="cName" placeholder="名前">
 <label>プロフィール・説明</label><textarea id="cDesc" placeholder="どんなキャラクター？"></textarea>
 <label>性格</label><textarea id="cPerson" placeholder="性格や口調"></textarea>
 <label>最初のメッセージ</label><textarea id="cGreeting" placeholder="こんにちは！"></textarea>
 <label>アイコン画像</label><input id="cImage" type="file" accept="image/*">
 <label>アイコン（画像がない場合）</label><input id="cEmoji" value="✨" maxlength="4">
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveCharacter()">作成</button></div>`;
}
function closeModal(){document.getElementById("modalBg").classList.add("hidden")}
function saveCharacter(){
 const name=document.getElementById("cName").value.trim();
 if(!name){toast("名前を入力してね");return}
 const file=document.getElementById("cImage").files[0];
 const obj={
  id:Date.now().toString(),name,
  description:document.getElementById("cDesc").value,
  personality:document.getElementById("cPerson").value,
  greeting:document.getElementById("cGreeting").value||"こんにちは！",
  emoji:document.getElementById("cEmoji").value||"✨",
  color:"#765ca6",favorite:false,mine:true
 };
 if(file){
  const reader=new FileReader();
  reader.onload=e=>{
   obj.image=e.target.result;
   characters.unshift(obj);save();closeModal();showPage("mychars");
  };
  reader.readAsDataURL(file);
 }else{
  characters.unshift(obj);save();closeModal();showPage("mychars");
 }
}
function editCharacter(id){
 const c=getChar(id);
 document.getElementById("modalBg").classList.remove("hidden");
 document.getElementById("modal").innerHTML=`
 <h2>キャラクター編集</h2>
 <label>名前</label><input id="eName" value="${esc(c.name)}">
 <label>説明</label><textarea id="eDesc">${esc(c.description)}</textarea>
 <label>性格</label><textarea id="ePerson">${esc(c.personality)}</textarea>
 <label>最初のメッセージ</label><textarea id="eGreeting">${esc(c.greeting)}</textarea>
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveEdit('${id}')">保存</button></div>`;
}
function saveEdit(id){
 const c=getChar(id);
 c.name=document.getElementById("eName").value;
 c.description=document.getElementById("eDesc").value;
 c.personality=document.getElementById("ePerson").value;
 c.greeting=document.getElementById("eGreeting").value;
 save();closeModal();renderChat();
}
function deleteCharacter(id){
 if(!confirm("このキャラクターを削除する？"))return;
 characters=characters.filter(c=>c.id!==id);
 delete chats[id];save();current=null;showPage("mychars");
}
function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[m]));
}
render();
</script>
</body>
</html>
